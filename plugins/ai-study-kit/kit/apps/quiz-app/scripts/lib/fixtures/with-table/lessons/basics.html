<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>变量与循环基础</title></head>
<body>
<h1>变量与循环基础</h1>
<p>变量是给值起的名字。声明变量之后可以给它赋值。</p>
<p>变量的值可以被覆盖：对同一个变量再次赋值，后一次生效。</p>
<p>给变量起名要能表达用途，这是变量可读性的核心。</p>
<p>循环用来重复执行一段代码。循环每轮先判断条件，条件成立才进入循环体。</p>
<p>循环的次数由条件控制：条件不成立时循环结束。</p>
<p>写循环时注意更新循环依赖的变量，否则循环可能停不下来。</p>
</body>
</html>
