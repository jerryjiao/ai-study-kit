<!-- 官网 favicon：assets/logo.png（三段弧学习闭环 + 琥珀对勾徽章）的矢量版，
     与 generate-logo.mjs 的 c0-loop-check 同概念，配色对齐 quiz-app indigo/violet 主题 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 三段弧连成的闭环（周长 ≈ 88，弧:缺口 = 19:10.3） -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#fff" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="19 10.3"
          transform="rotate(-36 32 32)"/>
  <!-- 环上站点：琥珀对勾徽章 -->
  <circle cx="45" cy="19" r="8.5" fill="#f59e0b"/>
  <path d="M41.2 19.2 l2.6 2.6 l4.8 -5.4" fill="none" stroke="#fff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
